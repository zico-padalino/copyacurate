services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: copyacurate-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-copyacurate}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - copyacurate

  nginx:
    image: nginx:1.27-alpine
    container_name: copyacurate-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - copyacurate

  mysql:
    image: mysql:8.4
    container_name: copyacurate-mysql
    restart: unless-stopped
    # Port 3307 agar tidak bentrok dengan MySQL lokal Navicat (3306)
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-copyacurate}
    volumes:
      - copyacurate-mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - copyacurate

  redis:
    image: redis:7-alpine
    container_name: copyacurate-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - copyacurate-redis:/data
    networks:
      - copyacurate

  mailpit:
    image: axllent/mailpit:latest
    container_name: copyacurate-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - copyacurate

networks:
  copyacurate:
    driver: bridge

volumes:
  copyacurate-mysql:
  copyacurate-redis:
